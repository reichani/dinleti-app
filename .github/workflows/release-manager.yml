name: Okurio Release Manager

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Üretimde çalışan ve kabul edilecek tam commit SHA"
        required: true
        type: string
      product_owner_name:
        description: "Production UX kabulünü veren Product Owner"
        required: true
        type: string
      acceptance_notes:
        description: "Production deneyimine ilişkin somut kabul notları"
        required: true
        type: string
      story_opened:
        description: "Hikâye production'da açıldı"
        required: true
        default: false
        type: boolean
      mobile_readable:
        description: "Mobil okuma deneyimi kabul edildi"
        required: true
        default: false
        type: boolean
      tts_correct:
        description: "TTS doğru çalıştı"
        required: true
        default: false
        type: boolean
      highlighting_correct:
        description: "Kelime/cümle vurgusu doğru çalıştı"
        required: true
        default: false
        type: boolean
      pause_resume_correct:
        description: "Duraklat/devam ettir doğru çalıştı"
        required: true
        default: false
        type: boolean
      progress_preserved:
        description: "Okuma ilerlemesi korundu"
        required: true
        default: false
        type: boolean
      age_experience_acceptable:
        description: "Yaşa uygun deneyim kabul edildi"
        required: true
        default: false
        type: boolean
      overall_experience_acceptable:
        description: "Uçtan uca production deneyimi kabul edildi"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: okurio-production-release
  cancel-in-progress: false

jobs:
  candidate-quality:
    name: Adayı yeniden doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Aday commit'i al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: İçerik kalite kapısı
        run: |
          npm run validate:content
          npm run test:content

      - name: Aday artifact'ı üret
        env:
          GITHUB_SHA: ${{ inputs.candidate_sha }}
        run: npm run build

      - name: Chromium kur ve regresyonları çalıştır
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Aday artifact'ı sakla
        uses: actions/upload-artifact@v4
        with:
          name: okurio-release-${{ inputs.candidate_sha }}
          path: dist/
          retention-days: 90

  production-acceptance:
    name: Production UX kabulü
    needs: candidate-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dinleti-app.pages.dev
    steps:
      - name: Aday commit'i al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Production SHA'sını doğrula
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          PRODUCTION_URL: https://dinleti-app.pages.dev
        run: |
          node -e "fetch(process.env.PRODUCTION_URL + '/release.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('release.json ' + r.status); return r.json(); }).then(x => { if (x.commit !== process.env.EXPECTED_SHA) throw new Error('Production SHA ' + x.commit + ' beklenen ' + process.env.EXPECTED_SHA); console.log('Production SHA doğrulandı:', x.commit); })"

      - name: Production Chromium smoke testi
        run: npx playwright install --with-deps chromium

      - name: Kalıcı production adresini test et
        env:
          PLAYWRIGHT_BASE_URL: https://dinleti-app.pages.dev
        run: npx playwright test tests/app-smoke.spec.js tests/links.spec.js tests/responsive-reader-ux.spec.js --project=desktop-chrome --project=samsung-s24

      - name: Product Owner kabul kaydını doğrula
        env:
          OWNER_NAME: ${{ inputs.product_owner_name }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
          STORY_OPENED: ${{ inputs.story_opened }}
          MOBILE_READABLE: ${{ inputs.mobile_readable }}
          TTS_CORRECT: ${{ inputs.tts_correct }}
          HIGHLIGHTING_CORRECT: ${{ inputs.highlighting_correct }}
          PAUSE_RESUME_CORRECT: ${{ inputs.pause_resume_correct }}
          PROGRESS_PRESERVED: ${{ inputs.progress_preserved }}
          AGE_EXPERIENCE_ACCEPTABLE: ${{ inputs.age_experience_acceptable }}
          OVERALL_EXPERIENCE_ACCEPTABLE: ${{ inputs.overall_experience_acceptable }}
        run: |
          test -n "$OWNER_NAME"
          test -n "$ACCEPTANCE_NOTES"
          test "$STORY_OPENED" = "true"
          test "$MOBILE_READABLE" = "true"
          test "$TTS_CORRECT" = "true"
          test "$HIGHLIGHTING_CORRECT" = "true"
          test "$PAUSE_RESUME_CORRECT" = "true"
          test "$PROGRESS_PRESERVED" = "true"
          test "$AGE_EXPERIENCE_ACCEPTABLE" = "true"
          test "$OVERALL_EXPERIENCE_ACCEPTABLE" = "true"

      - name: Kabul raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okurio-production-acceptance-${{ inputs.candidate_sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90
