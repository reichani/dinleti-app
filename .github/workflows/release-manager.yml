name: Okurio Release Manager

on:
  workflow_run:
    workflows: ["Okurio Regression and Build Checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Yeniden doğrulanacak production commit SHA (boşsa main HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: okurio-production-release
  cancel-in-progress: false

jobs:
  production-acceptance:
    name: Otomatik production kanıtı
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dinleti-app.pages.dev
    steps:
      - name: Aday commit'i al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.workflow_run.head_sha || 'main' }}

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Cloudflare deploy ve production SHA'sını bekle
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha || github.event.workflow_run.head_sha }}
          PRODUCTION_URL: ${{ vars.DINLETI_LIVE_URL || 'https://dinleti-app.pages.dev' }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then EXPECTED_SHA=$(git rev-parse HEAD); fi
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$PRODUCTION_URL/release.json" > /tmp/release.json; then
              LIVE_SHA=$(node -e "console.log(require('/tmp/release.json').commit || '')")
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                echo "Production SHA doğrulandı: $LIVE_SHA"
                exit 0
              fi
              echo "Deneme $attempt: production SHA $LIVE_SHA, beklenen $EXPECTED_SHA"
            fi
            sleep 15
          done
          echo "Production kalıcı URL doğru SHA'yı servis etmedi"
          exit 1

      - name: Production Chromium smoke testi
        run: npx playwright install --with-deps chromium

      - name: Kalıcı production adresini test et
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.DINLETI_LIVE_URL || 'https://dinleti-app.pages.dev' }}
        run: npx playwright test tests/app-smoke.spec.js tests/links.spec.js tests/responsive-reader-ux.spec.js --project=desktop-chrome --project=samsung-s24

      - name: Kabul raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okurio-production-evidence-${{ inputs.candidate_sha || github.event.workflow_run.head_sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90
