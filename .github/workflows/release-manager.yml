name: Okurio Release Manager

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Üretimde doğrulanacak tam commit SHA"
        required: true
        type: string
      release_manager_approved:
        description: "Release Manager aday kapsamını ve kalite kapısını onayladı"
        required: true
        default: false
        type: boolean
      samsung_s24_plus_verified:
        description: "Reyhan gerçek Samsung S24+ üzerinde kontrol etti"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: okurio-production-release
  cancel-in-progress: false

jobs:
  release-guard:
    name: Release Manager onayı
    runs-on: ubuntu-latest
    steps:
      - name: İnsan onaylarını zorunlu tut
        env:
          RM_APPROVED: ${{ inputs.release_manager_approved }}
          S24_APPROVED: ${{ inputs.samsung_s24_plus_verified }}
        run: |
          test "$RM_APPROVED" = "true"
          test "$S24_APPROVED" = "true"

  candidate-quality:
    name: Adayı yeniden doğrula
    needs: release-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Aday commit'i al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: İçerik kalite kapısı
        run: |
          npm run validate:content
          npm run test:content

      - name: Aday artifact'ı üret
        env:
          GITHUB_SHA: ${{ inputs.candidate_sha }}
        run: npm run build

      - name: Chromium kur ve regresyonları çalıştır
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Aday artifact'ı sakla
        uses: actions/upload-artifact@v4
        with:
          name: okurio-release-${{ inputs.candidate_sha }}
          path: dist/
          retention-days: 90

  production-acceptance:
    name: Production kabulü
    needs: candidate-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dinleti-app.pages.dev
    steps:
      - name: Aday commit'i al
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Production SHA'sını doğrula
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          PRODUCTION_URL: https://dinleti-app.pages.dev
        run: |
          node -e "fetch(process.env.PRODUCTION_URL + '/release.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('release.json ' + r.status); return r.json(); }).then(x => { if (x.commit !== process.env.EXPECTED_SHA) throw new Error('Production SHA ' + x.commit + ' beklenen ' + process.env.EXPECTED_SHA); console.log('Production SHA doğrulandı:', x.commit); })"

      - name: Production Chromium smoke testi
        run: npx playwright install --with-deps chromium

      - name: Kalıcı production adresini test et
        env:
          PLAYWRIGHT_BASE_URL: https://dinleti-app.pages.dev
        run: npx playwright test tests/app-smoke.spec.js tests/links.spec.js tests/responsive-reader-ux.spec.js --project=desktop-chrome --project=samsung-s24

      - name: Kabul raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okurio-production-acceptance-${{ inputs.candidate_sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90
