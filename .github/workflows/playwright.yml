name: Okurio Regression and Build Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm install

      - name: Production build oluştur
        run: npm run build

      - name: Deployment paketini doğrula
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/_headers
          test -d dist/assets

      - name: Playwright Chromium kur
        run: npx playwright install --with-deps chromium

      - name: Regresyon testlerini çalıştır
        run: npm test

      - name: Build paketini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okurio-production-build
          path: dist/
          retention-days: 14

      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Hata kayıtlarını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
