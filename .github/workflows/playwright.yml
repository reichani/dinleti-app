name: Okurio Build and Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Production build doğrulaması
        run: npm run build

      - name: Cloudflare Pages çıktı kontrolü
        run: |
          test -f dist/index.html
          test -f dist/_redirects

      - name: Playwright Chromium kur
        run: npx playwright install --with-deps chromium

      - name: Regresyon testlerini çalıştır
        run: npm test

      - name: Production build çıktısını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Hata kayıtlarını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
