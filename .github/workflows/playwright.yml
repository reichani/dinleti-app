name: Okurio Regression and Build Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okurio-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları deterministik kur
        run: npm ci --no-audit --no-fund

      - name: İçerik yapısını doğrula
        run: npm run validate:content

      - name: İçerik testlerini çalıştır
        run: npm run test:content

      - name: Production build oluştur
        run: npm run build

      - name: Deployment paketini doğrula
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/release.json
          test -d dist/assets
          node -e "const r=require('./dist/release.json'); if(!r.commit) process.exit(1)"

      - name: Regresyon testlerini çalıştır
        run: npm test

      - name: Build paketini sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: okurio-production-build
          path: dist/
          retention-days: 30

      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Hata kayıtlarını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
