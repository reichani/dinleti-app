name: Apply reader UX v2.5.1

on:
  push:
    branches:
      - ux-reader-compact-v2-5-1
    paths:
      - scripts/apply-reader-ux-v251.mjs
      - .github/workflows/apply-reader-ux-v251.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux-reader-compact-v2-5-1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply UX patch
        run: node scripts/apply-reader-ux-v251.mjs

      - name: Install dependencies and refresh lock
        run: npm install --no-audit --no-fund

      - name: Validate pilot content
        run: npm run validate:content

      - name: Run content tests
        run: npm run test:content

      - name: Production build
        run: npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply compact reader UX v2.5.1"
            git push origin HEAD:ux-reader-compact-v2-5-1
          fi
