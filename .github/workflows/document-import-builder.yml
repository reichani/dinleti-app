name: Document import feature builder

on:
  push:
    branches:
      - feature/document-import-reader

permissions:
  contents: write

jobs:
  build-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-import-reader
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply document import slice
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
            '>Kendi metnini oku</strong>': '>Kendi İçeriğini Ekle</strong>',
            '>Kopyala-yapıştır veya TXT</span>': '>TXT dosyası veya metin yapıştır · Word/PDF/PPTX sırada</span>',
            '>Kendi metnini oku</h2>': '>Kendi İçeriğini Ekle</h2>',
            '>Metni yalnızca bu cihazda okuma görünümüne hazırlar.</div>': '>Dosya veya yapıştırılan metin önce önizlenir, sonra mevcut Okurio Reader’da açılır. İçerik bu cihazdan yayınlanmaz.</div>',
            '>TXT seç\n                  <input type="file" accept=".txt,text/plain"': '>TXT dosyası seç\n                  <input type="file" accept=".txt,text/plain"',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected source fragment not found: {old[:80]}')
            text = text.replace(old, new, 1)

          pattern = re.compile(r'''  const dosyaMetniYukle = useCallback\(\(e\) => \{.*?\n  \}, \[kendiMetniAc\]\);''', re.S)
          replacement = '''  const dosyaMetniYukle = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const MAX_DOSYA_BOYUTU = 5 * 1024 * 1024;
    const dosyaAdi = file.name || "metin.txt";
    const kucukAd = dosyaAdi.toLowerCase();
    if (file.size > MAX_DOSYA_BOYUTU) {
      setKendiMetinMesaji("Dosya 5 MB sınırını aşıyor. Daha küçük bir TXT dosyası seç.");
      e.target.value = "";
      return;
    }
    if (!kucukAd.endsWith(".txt") && !file.type.startsWith("text/")) {
      setKendiMetinMesaji("Bu ilk feature diliminde TXT destekleniyor. Word, PDF ve PowerPoint aynı belge içe aktarma hattına sıradaki adımlarda eklenecek.");
      e.target.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const metin = String(reader.result || "").replace(/\\r\\n/g, "\\n").trim();
      if (metin.length < 20) {
        setKendiMetinMesaji("Dosyada okunabilir yeterli metin bulunamadı.");
        return;
      }
      setKendiBaslik(dosyaAdi.replace(/\\.txt$/i, ""));
      setKendiMetin(metin);
      setKendiMetinMesaji(`${dosyaAdi} okumaya hazır. Önizlemeyi kontrol edip “Okuma moduna al”a dokun.`);
    };
    reader.onerror = () => setKendiMetinMesaji("Dosya okunamadı. Lütfen farklı bir TXT dosyası dene.");
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  }, []);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'dosyaMetniYukle replacement count={count}')

          path.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Validate production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate document import contract
        run: npx playwright test tests/document-import.spec.js --project=desktop-chrome
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Add TXT document import preview flow"
          git push origin HEAD:feature/document-import-reader
