name: Apply resume hydration fix

on:
  push:
    branches:
      - test/resume-reading-regression
    paths:
      - scripts/apply-resume-hydration-fix.mjs
      - src/reader-core.js
      - .github/workflows/apply-resume-hydration-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-resume-hydration-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/resume-reading-regression
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/apply-resume-hydration-fix.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(reader): restore exact cursor after reload"
          git push origin HEAD:test/resume-reading-regression
