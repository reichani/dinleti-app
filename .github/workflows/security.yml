name: Security gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan tracked files for secrets
        run: node scripts/security-scan.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production build
        run: npm run build

      - name: Verify production source maps are absent
        run: |
          if find dist -type f -name '*.map' | grep -q .; then
            echo 'Production source maps found in dist.'
            find dist -type f -name '*.map'
            exit 1
          fi
