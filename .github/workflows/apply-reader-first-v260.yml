name: Apply reader-first v2.6.0

on:
  push:
    branches: [reader-first-v2-6-0d]
    paths:
      - scripts/apply-reader-first-v260.mjs
      - .github/workflows/apply-reader-first-v260.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-first-v2-6-0d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reader-first patch
        run: node scripts/apply-reader-first-v260.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate content
        run: npm run validate:content
      - name: Run content tests
        run: npm run test:content
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test
      - name: Commit validated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Release reader-first UX v2.6.0"
            git push origin HEAD:reader-first-v2-6-0d
          fi